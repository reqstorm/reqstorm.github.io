name: Build and deploy the site

# The documentation lives in melihcolpan/reqstorm under docs/, next to the code.
# This workflow builds it from there and publishes it to https://reqstorm.github.io.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # daily, to pick up documentation changes on master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: melihcolpan/reqstorm
          ref: master
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e . -r docs/requirements.txt
      - run: mkdocs build --strict --site-dir site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
